services:
  - type: web
    name: blade-storm
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js --prod
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: BOTS
        value: "3"
